services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safegit
      POSTGRES_USER: safegit
      POSTGRES_PASSWORD: safegit_dev_password
    volumes:
      - safegit-postgres:/var/lib/postgresql/data
    ports:
      - "${SAFEGIT_POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safegit -d safegit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SAFEGIT_DATABASE_URL: postgres://safegit:safegit_dev_password@postgres:5432/safegit
      SAFEGIT_PORT: 8787
      # Production hardening knobs:
      # SAFEGIT_CORS_ORIGIN: https://safegit.example.com
      # SAFEGIT_API_TOKEN: replace-with-a-long-random-token
      # SAFEGIT_TRUST_PROXY: true
      # SAFEGIT_RATE_LIMIT_WINDOW_MS: 60000
      # SAFEGIT_RATE_LIMIT_MAX: 60
      # Optional but recommended for live Safe owner/threshold validation:
      # SAFEGIT_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
    ports:
      - "8787:8787"

volumes:
  safegit-postgres:
